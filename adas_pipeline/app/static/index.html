<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ADAS — Living Pipeline</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&family=Exo+2:wght@300;400;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#050a14;--cyan:#00d4ff;--red:#ff3b3b;--green:#39ff14;--amber:#ffb700;
  --slate:#1e2d3d;--glass:rgba(255,255,255,0.04);--border:rgba(0,212,255,0.15);
  --muted:#4a6380;--text:#c8d8e8;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Exo 2',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}

/* scanlines */
body::after{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.03) 2px,rgba(0,0,0,0.03) 4px);pointer-events:none;z-index:1000}
/* vignette */
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,0.65) 100%);pointer-events:none;z-index:999}

/* rain */
.raindrop{position:fixed;width:1px;height:14px;background:linear-gradient(transparent,rgba(150,200,255,0.18));animation:rainFall linear infinite;transform:rotate(12deg);pointer-events:none;z-index:1}
@keyframes rainFall{from{transform:translateY(-20px) rotate(12deg)}to{transform:translateY(105vh) rotate(12deg)}}

/* particles */
.particle{position:fixed;width:2px;height:2px;border-radius:50%;background:var(--cyan);opacity:0;pointer-events:none;z-index:2;animation:ptFloat linear infinite}
@keyframes ptFloat{0%{transform:translateY(100vh) translateX(0);opacity:0}10%{opacity:.5}90%{opacity:.2}100%{transform:translateY(-30px) translateX(var(--dx,20px));opacity:0}}

/* blink */
@keyframes blink{50%{opacity:.15}}
/* spin */
@keyframes spin{to{transform:rotate(360deg)}}
/* reveal */
@keyframes revealUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}

/* ── HEADER ── */
.hdr{position:sticky;top:0;z-index:500;display:flex;align-items:center;justify-content:space-between;padding:12px 28px;background:rgba(5,10,20,.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
.hdr-logo{font-family:'Orbitron',sans-serif;font-size:.95rem;font-weight:900;letter-spacing:4px;color:var(--cyan);text-shadow:0 0 20px rgba(0,212,255,.5)}
.hdr-mid{font-family:'Share Tech Mono',monospace;font-size:.72rem;color:var(--muted);letter-spacing:2px}
.hdr-right{display:flex;align-items:center;gap:16px;font-family:'Share Tech Mono',monospace;font-size:.7rem;color:var(--muted)}
.sdot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:blink 2s ease-in-out infinite}

/* global arc */
.garc{position:fixed;bottom:22px;right:22px;z-index:600;width:60px;height:60px;display:none}
.garc.on{display:block}
.garc svg{transform:rotate(-90deg)}
.garc-bg{fill:none;stroke:rgba(0,212,255,.1);stroke-width:5}
.garc-fill{fill:none;stroke:var(--cyan);stroke-width:5;stroke-linecap:round;stroke-dasharray:157;stroke-dashoffset:157;transition:stroke-dashoffset .5s ease;filter:drop-shadow(0 0 4px var(--cyan))}
.garc-lbl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Orbitron',sans-serif;font-size:.5rem;color:var(--cyan)}

/* ── CAR SCENE ── */
.car-scene{width:100%;height:190px;position:relative;overflow:hidden;border-bottom:1px solid var(--border)}

/* scrolling road marks */
.road-marks{position:absolute;bottom:12px;left:0;right:0;height:4px;overflow:hidden}
.road-track{display:flex;gap:18px;animation:roadScroll 1.2s linear infinite;white-space:nowrap}
.road-mark{width:28px;height:3px;background:rgba(255,255,255,.14);border-radius:2px;flex-shrink:0}
@keyframes roadScroll{to{transform:translateX(-46px)}}
body.pl-running .road-track{animation-duration:.5s}
body.pl-done    .road-track{animation-duration:2.5s}

/* car bob */
.scene-car{position:absolute;bottom:30px;left:13%;animation:carBob .4s ease-in-out infinite alternate}
@keyframes carBob{from{transform:translateY(0)}to{transform:translateY(-2px)}}
body.pl-running .scene-car{animation-duration:.18s}
body.pl-done    .scene-car{animation-duration:.8s}

/* lidar */
.lidar{position:absolute;top:-14px;left:50%;transform-origin:center;animation:spin 2.5s linear infinite}
body.pl-running .lidar{animation-duration:.6s}

/* det boxes */
.det-box{position:absolute;border:1px solid var(--green);border-radius:2px;animation:detPop 3s ease-in-out infinite;opacity:0;font-family:'Orbitron',sans-serif;font-size:5px;color:var(--green);padding:1px 2px}
@keyframes detPop{0%,100%{opacity:0}20%,80%{opacity:1}}
body.pl-running .det-box{animation-duration:1.1s}

/* done flag */
.scene-flag{position:absolute;bottom:30px;right:6%;opacity:0;transition:opacity .6s}
body.pl-done .scene-flag{opacity:1}

/* ── MAIN ── */
.main{position:relative;z-index:10;max-width:920px;margin:0 auto;padding:32px 20px 100px}

/* ── GLASS CARD ── */
.gcard{background:var(--glass);backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:20px;padding:30px;margin-bottom:24px;position:relative;overflow:hidden;animation:revealUp .5s ease forwards}
.gcard::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);opacity:.4}

.sec-lbl{font-family:'Orbitron',sans-serif;font-size:.62rem;letter-spacing:4px;color:var(--cyan);margin-bottom:22px;display:flex;align-items:center;gap:10px}
.sec-lbl .bcur{display:inline-block;width:2px;height:11px;background:var(--cyan);animation:blink 1s step-end infinite;margin-left:3px}
.sec-lbl::after{content:'';flex:1;height:1px;background:var(--border)}

/* ── UPLOAD ── */
#drop-zone{border:1px dashed rgba(0,212,255,.25);border-radius:14px;padding:44px 20px;text-align:center;cursor:pointer;transition:border-color .3s,background .3s;position:relative}
#drop-zone:hover,#drop-zone.dov{border-color:var(--cyan);background:rgba(0,212,255,.04)}
#drop-zone:hover .lidar-cam,#drop-zone.dov .lidar-cam{animation-duration:.5s}

/* camera char */
.cam-char{width:64px;height:64px;margin:0 auto 16px;position:relative}
.cam-body{position:absolute;top:18px;left:8px;width:48px;height:30px;background:var(--slate);border-radius:6px;border:1px solid rgba(0,212,255,.3)}
.cam-top-bit{position:absolute;top:10px;left:18px;width:18px;height:9px;background:var(--slate);border-radius:3px 3px 0 0;border:1px solid rgba(0,212,255,.2)}
.cam-lens{position:absolute;top:22px;left:24px;width:20px;height:20px;border-radius:50%;background:rgba(0,212,255,.12);border:2px solid var(--cyan);box-shadow:0 0 10px rgba(0,212,255,.5);animation:lensPulse 3s ease-in-out infinite;transition:background .3s,border-color .3s}
@keyframes lensPulse{0%,100%{box-shadow:0 0 10px rgba(0,212,255,.5)}50%{box-shadow:0 0 22px rgba(0,212,255,.9)}}
.cam-rec{position:absolute;top:19px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 6px var(--red);animation:blink 1s step-end infinite}
#drop-zone.acquired .cam-lens{background:rgba(57,255,20,.2);border-color:var(--green);box-shadow:0 0 14px rgba(57,255,20,.6)}

.drop-text{font-family:'Share Tech Mono',monospace;font-size:.95rem;color:var(--text);letter-spacing:2px}
.drop-text span{color:var(--cyan);cursor:pointer;text-decoration:underline}
.drop-sub{font-family:'Share Tech Mono',monospace;font-size:.68rem;color:var(--muted);margin-top:6px}
.fchips{display:flex;justify-content:center;gap:8px;margin-top:14px;flex-wrap:wrap}
.fchip{padding:3px 10px;border:1px solid rgba(0,212,255,.25);border-radius:99px;font-family:'Orbitron',sans-serif;font-size:.58rem;color:var(--cyan);letter-spacing:1px}
#file-input{display:none}

#tbadge{display:none;justify-content:center;margin-top:14px}
.tpill{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:99px;background:rgba(57,255,20,.08);border:1px solid rgba(57,255,20,.4);font-family:'Share Tech Mono',monospace;font-size:.72rem;color:var(--green)}

#run-btn{width:100%;margin-top:18px;padding:15px;border:none;border-radius:12px;font-family:'Orbitron',sans-serif;font-size:.82rem;font-weight:900;letter-spacing:3px;color:#000;cursor:pointer;position:relative;overflow:hidden;background:linear-gradient(90deg,var(--cyan),#0066ff,var(--cyan));background-size:200%;animation:shimmer 3s linear infinite;transition:transform .1s,box-shadow .2s}
@keyframes shimmer{0%{background-position:200% center}100%{background-position:-200% center}}
#run-btn:disabled{opacity:.3;cursor:not-allowed;animation:none}
#run-btn:not(:disabled):hover{box-shadow:0 0 30px rgba(0,212,255,.5);transform:translateY(-1px)}
.charge-fill{position:absolute;top:0;left:-100%;bottom:0;width:100%;background:rgba(255,255,255,.2)}
#run-btn:not(:disabled):hover .charge-fill{animation:chargeFill .4s ease forwards}
@keyframes chargeFill{to{left:0}}
.btn-inner{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:10px}

/* ── PIPELINE ARC ── */
.parc-wrap{display:flex;justify-content:center;margin-bottom:30px;position:relative}
.parc-svg{transform:rotate(-90deg)}
.parc-bg{fill:none;stroke:rgba(0,212,255,.08);stroke-width:5}
.parc-fill{fill:none;stroke:var(--cyan);stroke-width:5;stroke-linecap:round;stroke-dasharray:251.2;stroke-dashoffset:251.2;transition:stroke-dashoffset .5s ease;filter:drop-shadow(0 0 8px var(--cyan))}
.parc-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
.parc-pct{font-family:'Orbitron',sans-serif;font-size:1.5rem;font-weight:900;color:var(--cyan);display:block}
.parc-sub{font-family:'Exo 2',sans-serif;font-size:.58rem;color:var(--muted);letter-spacing:2px}

/* ── FLOWCHART ── */
.flowchart{position:relative}
.fc-spine{position:absolute;top:20px;bottom:20px;left:50%;width:2px;transform:translateX(-50%);background:rgba(0,212,255,.08);overflow:hidden;z-index:0}
.fc-spine::after{content:'';position:absolute;top:-100%;left:0;right:0;height:100%;background:linear-gradient(180deg,transparent,var(--cyan) 50%,transparent);opacity:0;transition:opacity .3s}
body.pl-running .fc-spine::after{opacity:1;animation:spineFlow 2s linear infinite}
@keyframes spineFlow{to{top:200%}}

.fc-row{display:grid;grid-template-columns:1fr 56px 1fr;align-items:center;margin-bottom:10px;position:relative;z-index:1}
.fc-mid{display:flex;flex-direction:column;align-items:center;gap:0}
.fc-circle{width:44px;height:44px;border-radius:50%;border:2px solid rgba(0,212,255,.2);background:rgba(5,10,20,.9);display:flex;align-items:center;justify-content:center;font-family:'Orbitron',sans-serif;font-size:.65rem;font-weight:700;color:var(--muted);position:relative;transition:all .3s ease;z-index:2;flex-shrink:0}
.fc-circle.active{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 0 5px rgba(0,212,255,.1),0 0 20px rgba(0,212,255,.3)}
.fc-circle.done{border-color:var(--green);color:var(--green);background:rgba(57,255,20,.07);box-shadow:0 0 16px rgba(57,255,20,.25)}
.fc-circle.error{border-color:var(--red);color:var(--red);background:rgba(255,59,59,.07);animation:nodeShake .4s ease}
@keyframes nodeShake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.nc-ring{position:absolute;inset:-6px;border-radius:50%;border:2px solid transparent;border-top-color:var(--cyan);border-right-color:rgba(0,212,255,.25);animation:spin .8s linear infinite;opacity:0;transition:opacity .3s}
.fc-circle.active .nc-ring{opacity:1}
.nc-chk{stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .5s ease .1s}
.fc-circle.done .nc-chk{stroke-dashoffset:0}

/* connector lines */
.fc-conn{height:1px;background:rgba(0,212,255,.1);position:relative;overflow:hidden;transition:background .3s;width:100%}
.fc-conn.active{background:rgba(0,212,255,.4)}
.fc-conn.done{background:rgba(57,255,20,.3)}
.fc-conn.active::after{content:'';position:absolute;top:0;left:-100%;height:100%;width:100%;background:linear-gradient(90deg,transparent,var(--cyan),transparent);animation:connFlow 1.2s ease-in-out infinite}
@keyframes connFlow{to{left:100%}}

/* stage cards */
.fc-card{background:rgba(5,10,20,.7);border:1px solid rgba(0,212,255,.08);border-radius:14px;padding:12px 14px;transition:all .3s ease;position:relative;overflow:hidden}
.fc-card.active{border-color:rgba(0,212,255,.35);background:rgba(0,212,255,.04);box-shadow:0 0 20px rgba(0,212,255,.07)}
.fc-card.done{border-color:rgba(57,255,20,.18)}
.fc-card.error{border-color:rgba(255,59,59,.3);background:rgba(255,59,59,.04)}
.fc-empty{visibility:hidden}

.fc-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:6px;margin-bottom:8px}
.fc-name{font-family:'Orbitron',sans-serif;font-size:.58rem;font-weight:700;letter-spacing:.5px;color:var(--muted);transition:color .3s;flex:1}
.fc-card.active .fc-name{color:var(--cyan)}
.fc-card.done   .fc-name{color:var(--green)}
.fc-card.error  .fc-name{color:var(--red)}
.fc-badge{font-family:'Exo 2',sans-serif;font-size:.55rem;font-weight:600;letter-spacing:1px;padding:2px 7px;border-radius:99px;white-space:nowrap}
.bw{background:rgba(74,99,128,.15);color:var(--muted);border:1px solid rgba(74,99,128,.25)}
.br{background:rgba(0,212,255,.1);color:var(--cyan);border:1px solid rgba(0,212,255,.3)}
.bd{background:rgba(57,255,20,.08);color:var(--green);border:1px solid rgba(57,255,20,.3)}
.be{background:rgba(255,59,59,.1);color:var(--red);border:1px solid rgba(255,59,59,.3)}

.fc-char-row{display:flex;align-items:flex-end;gap:8px}
.fc-char{width:34px;height:34px;flex-shrink:0;position:relative}

/* ZZZs on waiting */
.zzz{position:absolute;top:-4px;right:-2px;font-size:.55rem;color:var(--muted);opacity:0;animation:zFloat 2s ease-in-out infinite}
.fc-card:not(.active):not(.done):not(.error) .zzz{opacity:.6}
.fc-card.active .zzz,.fc-card.done .zzz,.fc-card.error .zzz{opacity:0!important;display:none}
@keyframes zFloat{0%,100%{transform:translateY(0);opacity:.1}50%{transform:translateY(-8px);opacity:.6}}

.fc-right-col{flex:1}
.fc-subbar-track{height:3px;background:rgba(255,255,255,.05);border-radius:2px;overflow:hidden;margin-bottom:4px}
.fc-subbar-fill{height:100%;border-radius:2px;width:0%}
.fc-card.active .fc-subbar-fill{animation:indet 1.5s ease-in-out infinite;background:var(--cyan)}
.fc-card.done   .fc-subbar-fill{width:100%;background:var(--green)}
.fc-card.error  .fc-subbar-fill{width:55%;background:var(--red)}
@keyframes indet{0%{width:0%;margin-left:0%}50%{width:60%;margin-left:20%}100%{width:0%;margin-left:100%}}
.fc-status{font-family:'Share Tech Mono',monospace;font-size:.58rem;color:var(--muted);transition:color .3s}
.fc-card.active .fc-status{color:rgba(0,212,255,.7)}
.fc-card.done   .fc-status{color:rgba(57,255,20,.7)}
.fc-card.error  .fc-status{color:rgba(255,59,59,.7)}

/* ── CHARACTER ANIMATIONS ── */

/* Inspector eye scan */
.insp-glass{transition:transform .3s}
.fc-card.active .insp-glass{animation:glassScan 1s ease-in-out infinite alternate}
@keyframes glassScan{from{transform:translateX(-4px)}to{transform:translateX(4px)}}

/* Film strip scroll */
.fc-card.active .film-inner{animation:filmScroll .5s steps(4) infinite}
@keyframes filmScroll{to{transform:translateY(-8px)}}

/* Broom sweep */
.fc-card.active .broom-arm{animation:broomSweep .6s ease-in-out infinite alternate;transform-origin:12px 10px}
@keyframes broomSweep{from{transform:rotate(-15deg)}to{transform:rotate(15deg)}}

/* Eye scan */
.fc-card.active .eye-scan{animation:eyeScanLine 1s linear infinite}
@keyframes eyeScanLine{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
.fc-card.active .eye-pupil{animation:pupilDilate .8s ease-in-out infinite alternate}
@keyframes pupilDilate{from{r:3}to{r:5}}

/* Runner */
.fc-card.active .run-fig{animation:runBounce .3s ease-in-out infinite alternate}
@keyframes runBounce{from{transform:translateY(0)}to{transform:translateY(-4px)}}
.fc-card.active .run-arm{animation:runArm .3s ease-in-out infinite alternate;transform-origin:17px 14px}
@keyframes runArm{from{transform:rotate(-20deg)}to{transform:rotate(20deg)}}

/* Brain pulse */
.fc-card.active .brain-body{animation:brainPulse .7s ease-in-out infinite alternate}
@keyframes brainPulse{from{opacity:.6}to{opacity:1;filter:drop-shadow(0 0 6px var(--cyan))}}

/* Knight flag raise */
.fc-card.active .knight-flag{animation:flagRaise .8s ease-in-out infinite alternate;transform-origin:17px 20px}
@keyframes flagRaise{from{transform:rotate(10deg)}to{transform:rotate(-5deg)}}

/* Box robot stack */
.fc-card.active .box-top{animation:boxStack .8s ease-in-out infinite alternate}
@keyframes boxStack{from{transform:translateY(4px)}to{transform:translateY(0)}}

/* Camera crank */
.fc-card.active .cam-crank{animation:crankTurn .4s linear infinite;transform-origin:29px 17px}
@keyframes crankTurn{to{transform:rotate(360deg)}}

/* Scribe pen */
.fc-card.active .scribe-pen{animation:penWrite .3s ease-in-out infinite alternate;transform-origin:26px 22px}
@keyframes penWrite{from{transform:rotate(-10deg)}to{transform:rotate(10deg)}}

/* ── TERMINAL ── */
.term-outer{background:#010409;border-radius:14px;border:1px solid rgba(0,212,255,.12);overflow:hidden;margin-top:22px}
.term-hdr{display:flex;align-items:center;justify-content:space-between;padding:9px 15px;background:rgba(0,212,255,.03);border-bottom:1px solid rgba(0,212,255,.07)}
.t-dots{display:flex;gap:6px}
.t-dots span{width:10px;height:10px;border-radius:50%}
.t-dots span:nth-child(1){background:#ff5f56}
.t-dots span:nth-child(2){background:#ffbd2e}
.t-dots span:nth-child(3){background:#27c93f}
.t-title{font-family:'Orbitron',sans-serif;font-size:.58rem;letter-spacing:3px;color:var(--muted)}
#copy-btn{font-family:'Share Tech Mono',monospace;font-size:.62rem;background:none;border:1px solid rgba(0,212,255,.2);border-radius:6px;color:var(--muted);padding:3px 10px;cursor:pointer;transition:color .2s,border-color .2s}
#copy-btn:hover{color:var(--cyan);border-color:var(--cyan)}
#log-box{padding:12px 16px;height:175px;overflow-y:auto;font-family:'Share Tech Mono',monospace;font-size:.7rem;line-height:1.8;scrollbar-width:thin;scrollbar-color:var(--cyan) transparent}
#log-box::-webkit-scrollbar{width:3px}
#log-box::-webkit-scrollbar-thumb{background:var(--cyan);border-radius:2px}
.ll{animation:fadeIn .2s ease forwards}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.li{color:#7dd3fc}.lw{color:var(--amber)}.ld{color:var(--green)}.le{color:var(--red)}.lm{color:var(--muted)}
.tcur{display:inline-block;width:7px;height:12px;background:var(--cyan);vertical-align:middle;animation:blink 1s step-end infinite;margin-left:2px}

/* waveform */
.waveform{display:flex;align-items:center;justify-content:center;gap:3px;padding:8px 16px;border-top:1px solid rgba(0,212,255,.06);height:34px}
.wb{width:3px;height:4px;background:rgba(0,212,255,.25);border-radius:2px;transition:height .1s}
body.pl-running .wb{animation:wavePulse var(--d,.4s) ease-in-out infinite alternate}
@keyframes wavePulse{to{height:var(--h,16px);background:var(--cyan)}}

/* ── RESULTS ── */
#results-sec{display:none}
.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:26px}
@media(min-width:580px){.stats-grid{grid-template-columns:repeat(4,1fr)}}
.stile{background:rgba(5,10,20,.85);border:1px solid var(--border);border-radius:16px;padding:18px 15px;position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s;cursor:default}
.stile:hover{transform:translateY(-3px)}
.stile::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:var(--tc);border-radius:0 0 16px 16px}
.stile.c{--tc:var(--cyan)}.stile.b{--tc:#818cf8}.stile.r{--tc:var(--red)}.stile.g{--tc:var(--green)}
.stile:hover{box-shadow:0 0 22px rgba(0,0,0,.2)}
.st-icon{margin-bottom:8px;opacity:.65}
.st-val{font-family:'Orbitron',sans-serif;font-size:1.8rem;font-weight:900;color:var(--tc);line-height:1;margin-bottom:4px}
.stile.r .st-val{animation:redPulse 2s ease-in-out infinite}
@keyframes redPulse{50%{text-shadow:0 0 18px var(--red)}}
.st-label{font-family:'Exo 2',sans-serif;font-size:.62rem;color:var(--muted);letter-spacing:1px}
.sparkline{margin-top:10px;height:22px;overflow:visible}
.sparkline path{fill:none;stroke:var(--tc);stroke-width:1.5;stroke-linecap:round;stroke-dasharray:300;stroke-dashoffset:300;transition:stroke-dashoffset 1.5s ease}
.sparkline.drawn path{stroke-dashoffset:0}

/* timeline */
.tl-wrap{margin-bottom:22px;position:relative}
.tl-label{font-family:'Exo 2',sans-serif;font-size:.6rem;color:var(--muted);letter-spacing:2px;margin-bottom:8px}
.tl-bar{display:flex;height:16px;border-radius:6px;overflow:hidden;gap:1px;cursor:pointer;animation:tlReveal .8s ease forwards}
@keyframes tlReveal{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0% 0 0)}}
.tl-f{flex:1;min-width:1px;background:rgba(57,255,20,.35);transition:transform .1s}
.tl-f.d{background:rgba(255,59,59,.55)}
.tl-f:hover{transform:scaleY(1.5)}
.tl-tip{position:absolute;background:rgba(5,10,20,.95);border:1px solid var(--border);border-radius:8px;padding:5px 10px;font-family:'Share Tech Mono',monospace;font-size:.62rem;color:var(--text);pointer-events:none;white-space:nowrap;opacity:0;transition:opacity .15s;z-index:50;top:-36px}

/* video */
.vid-wrap{border-radius:14px;overflow:hidden;border:1px solid var(--border);background:#000;margin-bottom:22px;position:relative}
#result-video{width:100%;display:block}
.vid-ovl{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.55));padding:10px 14px 6px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.vid-fnum{font-family:'Share Tech Mono',monospace;font-size:.62rem;color:rgba(255,255,255,.45)}
.dmeter{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:7px;height:70px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden;border:1px solid rgba(255,255,255,.1)}
.dm-fill{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(to top,var(--green),var(--amber),var(--red));height:40%;transition:height .3s;border-radius:4px}

/* ── FILE QUEUE ── */
.queue-wrap{margin-top:18px;display:none}
.queue-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.queue-title{font-family:'Orbitron',sans-serif;font-size:.6rem;letter-spacing:3px;color:var(--cyan)}
.queue-actions{display:flex;gap:8px}
.q-btn{font-family:'Share Tech Mono',monospace;font-size:.65rem;background:none;border:1px solid var(--border);border-radius:6px;color:var(--muted);padding:4px 12px;cursor:pointer;transition:color .2s,border-color .2s}
.q-btn:hover{color:var(--cyan);border-color:var(--cyan)}
.q-btn.danger:hover{color:var(--red);border-color:var(--red)}
.queue-list{display:flex;flex-direction:column;gap:6px;max-height:220px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--cyan) transparent}
.queue-list::-webkit-scrollbar{width:3px}
.queue-list::-webkit-scrollbar-thumb{background:var(--cyan);border-radius:2px}

.q-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;border:1px solid rgba(0,212,255,.08);background:rgba(5,10,20,.6);transition:border-color .2s}
.q-row.active{border-color:rgba(0,212,255,.4);background:rgba(0,212,255,.04)}
.q-row.done{border-color:rgba(57,255,20,.2)}
.q-row.error{border-color:rgba(255,59,59,.25)}
.q-num{font-family:'Orbitron',sans-serif;font-size:.6rem;color:var(--muted);width:18px;text-align:center;flex-shrink:0}
.q-icon{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.7rem;flex-shrink:0;border:1px solid rgba(0,212,255,.2);color:var(--muted);background:var(--bg)}
.q-row.active .q-icon{border-color:var(--cyan);color:var(--cyan);animation:spin .8s linear infinite}
.q-row.done  .q-icon{border-color:var(--green);color:var(--green)}
.q-row.error .q-icon{border-color:var(--red);color:var(--red)}
.q-info{flex:1;min-width:0}
.q-name{font-family:'Share Tech Mono',monospace;font-size:.72rem;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q-meta{font-family:'Exo 2',sans-serif;font-size:.6rem;color:var(--muted);margin-top:2px}
.q-badge{font-family:'Exo 2',sans-serif;font-size:.58rem;font-weight:700;padding:2px 8px;border-radius:99px;letter-spacing:.5px;flex-shrink:0}
.qb-pending{background:rgba(74,99,128,.15);color:var(--muted);border:1px solid rgba(74,99,128,.2)}
.qb-running{background:rgba(0,212,255,.1);color:var(--cyan);border:1px solid rgba(0,212,255,.3)}
.qb-done{background:rgba(57,255,20,.08);color:var(--green);border:1px solid rgba(57,255,20,.3)}
.qb-error{background:rgba(255,59,59,.1);color:var(--red);border:1px solid rgba(255,59,59,.25)}
.q-remove{background:none;border:none;color:var(--muted);cursor:pointer;font-size:.9rem;line-height:1;padding:2px 4px;transition:color .2s;flex-shrink:0}
.q-remove:hover{color:var(--red)}
.q-remove:disabled{opacity:.2;cursor:not-allowed}

/* ── RESULTS LIST ── */
.results-list{display:flex;flex-direction:column;gap:16px}
.res-card{background:var(--glass);backdrop-filter:blur(12px);border:1px solid rgba(57,255,20,.2);border-radius:20px;overflow:hidden;position:relative}
.res-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--green),transparent);opacity:.4}
.res-hdr{display:flex;align-items:center;gap:14px;padding:18px 24px;cursor:pointer;transition:background .2s}
.res-hdr:hover{background:rgba(57,255,20,.03)}
.res-hdr-icon{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(57,255,20,.08);border:1px solid rgba(57,255,20,.3);color:var(--green);font-size:.75rem;flex-shrink:0}
.res-hdr-info{flex:1;min-width:0}
.res-filename{font-family:'Share Tech Mono',monospace;font-size:.8rem;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res-mini-stats{display:flex;gap:14px;margin-top:4px;flex-wrap:wrap}
.res-mini-stat{font-family:'Exo 2',sans-serif;font-size:.62rem;color:var(--muted)}
.res-mini-stat span{font-weight:700}
.res-mini-stat.danger span{color:var(--red)}
.res-mini-stat.safe   span{color:var(--green)}
.res-toggle{font-family:'Orbitron',sans-serif;font-size:.6rem;color:var(--muted);transition:transform .3s;flex-shrink:0}
.res-card.open .res-toggle{transform:rotate(180deg)}
.res-body{display:none;padding:0 24px 24px}
.res-card.open .res-body{display:block}

/* downloads */
.dl-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:500px){.dl-grid{grid-template-columns:repeat(4,1fr)}}
.dlcard{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 12px;border-radius:14px;border:1px solid var(--border);background:rgba(5,10,20,.8);cursor:pointer;text-decoration:none;color:var(--text);transition:transform .2s,box-shadow .2s;position:relative;overflow:hidden}
.dlcard:hover{transform:translateY(-3px)}
.dl-prog{position:absolute;bottom:0;left:0;height:3px;width:0%;border-radius:0 2px 2px 0}
.dlcard:hover .dl-prog{animation:dlFill .6s ease forwards}
@keyframes dlFill{to{width:100%}}
.dl-name{font-family:'Exo 2',sans-serif;font-size:.76rem;font-weight:700;text-align:center}
.dl-ext{font-family:'Orbitron',sans-serif;font-size:.56rem;letter-spacing:2px;color:var(--muted)}
</style>
</head>

<script>
// ── Clock & timer ──────────────────────────────────────────────────────
function updateClock(){
  document.getElementById('hdr-clock').textContent =
    new Date().toLocaleTimeString('en-US',{hour12:false});
}
updateClock(); setInterval(updateClock,1000);
let t0=Date.now();
setInterval(()=>{
  let s=Math.floor((Date.now()-t0)/1000);
  document.getElementById('hdr-timer').textContent=
    String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
},1000);

// ── Background rain ────────────────────────────────────────────────────
for(let i=0;i<28;i++){
  const d=document.createElement('div');
  d.className='raindrop';
  d.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*-100}px;animation-duration:${.6+Math.random()*.8}s;animation-delay:${Math.random()*2}s;opacity:${.4+Math.random()*.4}`;
  document.body.appendChild(d);
}

// ── Particles ─────────────────────────────────────────────────────────
for(let i=0;i<20;i++){
  const p=document.createElement('div');
  p.className='particle';
  p.style.cssText=`left:${Math.random()*100}%;animation-duration:${6+Math.random()*8}s;animation-delay:${Math.random()*8}s;--dx:${(Math.random()-.5)*60}px`;
  document.body.appendChild(p);
}

// ── Road marks ────────────────────────────────────────────────────────
const rt=document.getElementById('road-track');
for(let i=0;i<40;i++){const m=document.createElement('div');m.className='road-mark';rt.appendChild(m);}

// ── Waveform ──────────────────────────────────────────────────────────
const wf=document.getElementById('waveform');
const WH=[8,14,20,12,18,24,10,22,16,20,12,18,8,24,14,20,10,22,16,12];
const WD=['.35s','.5s','.4s','.6s','.3s','.45s','.55s','.38s','.48s','.42s','.52s','.36s','.44s','.58s','.32s','.46s','.54s','.4s','.5s','.38s'];
WH.forEach((h,i)=>{const b=document.createElement('div');b.className='wb';b.style.cssText=`--h:${h}px;--d:${WD[i]}`;wf.appendChild(b);});

// ── Stages ────────────────────────────────────────────────────────────
const STAGES=[
  {key:'input_validation',  label:'Input Validation',  char:'inspector'},
  {key:'frame_extraction',  label:'Frame Extraction',  char:'filmstrip'},
  {key:'frame_cleaning',    label:'Frame Cleaning',    char:'broom'},
  {key:'detection',         label:'Object Detection',  char:'eye'},
  {key:'tracking',          label:'ByteTrack',         char:'runner'},
  {key:'behavior_analysis', label:'Behavior Analysis', char:'brain'},
  {key:'intent_prediction', label:'Intent Prediction', char:'brain'},
  {key:'tagging',           label:'Safety Tagging',    char:'knight'},
  {key:'export',            label:'Export',            char:'boxes'},
  {key:'render',            label:'Render Video',      char:'camera'},
  {key:'xml',               label:'XML Annotations',   char:'scribe'},
];

let stageMap={}, completedStages=new Set(), activeStage=null;

function buildFlowchart(){
  const fc=document.getElementById('flowchart');
  fc.innerHTML='<div class="fc-spine"></div>';
  stageMap={};

  STAGES.forEach((s,i)=>{
    const isLeft=(i%2===0);
    const row=document.createElement('div');
    row.className='fc-row';

    const card=`
      <div class="fc-card" id="fcard-${s.key}">
        <div class="fc-card-top">
          <div class="fc-name">${s.label}</div>
          <div class="fc-badge bw" id="fbadge-${s.key}">WAITING</div>
        </div>
        <div class="fc-char-row">
          <div class="fc-char">${CHARS[s.char]||''}<div class="zzz">z</div></div>
          <div class="fc-right-col">
            <div class="fc-subbar-track"><div class="fc-subbar-fill" id="fsub-${s.key}"></div></div>
            <div class="fc-status" id="fstat-${s.key}">Waiting</div>
          </div>
        </div>
      </div>`;
    const empty=`<div class="fc-empty">&nbsp;</div>`;
    const mid=`
      <div class="fc-mid">
        <div class="fc-conn" id="fconn-a-${s.key}" style="width:100%;height:1px;margin-bottom:4px"></div>
        <div class="fc-circle" id="fcircle-${s.key}">
          <div class="nc-ring"></div>
          <span id="fcnum-${s.key}">${i+1}</span>
        </div>
        <div class="fc-conn" id="fconn-b-${s.key}" style="width:2px;height:16px;display:block;margin-top:4px;background:rgba(0,212,255,.08)"></div>
      </div>`;

    row.innerHTML = isLeft ? (card+mid+empty) : (empty+mid+card);
    fc.appendChild(row);
    stageMap[s.key]={
      card:  ()=>document.getElementById(`fcard-${s.key}`),
      circle:()=>document.getElementById(`fcircle-${s.key}`),
      badge: ()=>document.getElementById(`fbadge-${s.key}`),
      status:()=>document.getElementById(`fstat-${s.key}`),
      num:   ()=>document.getElementById(`fcnum-${s.key}`),
      connA: ()=>document.getElementById(`fconn-a-${s.key}`),
    };
  });
}

function setStage(key, state, statusText){
  const m=stageMap[key]; if(!m) return;
  const badgeCls={active:'br',done:'bd',error:'be',waiting:'bw'};
  const badgeText={active:'RUNNING',done:'DONE',error:'ERROR',waiting:'WAITING'};
  m.card().className=`fc-card ${state}`;
  m.circle().className=`fc-circle ${state}`;
  m.badge().className=`fc-badge ${badgeCls[state]||'bw'}`;
  m.badge().textContent=badgeText[state]||'WAITING';
  m.status().textContent=statusText;
  if(state==='done'){
    m.num().innerHTML=`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--green)" stroke-width="2.5"><polyline class="nc-chk" points="20 6 9 17 4 12"/></svg>`;
    m.connA().classList.add('done');
    completedStages.add(key);
    updateProgress(completedStages.size/STAGES.length*100);
  } else if(state==='active'){
    m.connA().classList.add('active');
  } else if(state==='error'){
    m.num().textContent='✕';
  }
}

function updateProgress(pct){
  const circ=251.2;
  document.getElementById('parc-fill').style.strokeDashoffset=circ-(pct/100)*circ;
  document.getElementById('parc-pct').textContent=Math.round(pct)+'%';
  const garc=document.getElementById('garc-fill');
  const gcirc=157;
  garc.style.strokeDashoffset=gcirc-(pct/100)*gcirc;
  document.getElementById('garc-lbl').textContent=Math.round(pct)+'%';
}

// ── File queue ─────────────────────────────────────────────────────────
let fileQueue=[];  // [{file, status:'pending'|'running'|'done'|'error', jobId}]
let queueRunning=false;

const dz=document.getElementById('drop-zone');
const fi=document.getElementById('file-input');
dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('dov')});
dz.addEventListener('dragleave',()=>dz.classList.remove('dov'));
dz.addEventListener('drop',e=>{
  e.preventDefault();dz.classList.remove('dov');
  addFiles(Array.from(e.dataTransfer.files));
});
fi.addEventListener('change',()=>{addFiles(Array.from(fi.files));fi.value='';});

const ALLOWED=new Set(['.mp4','.avi','.mov','.mkv','.m4v']);
function addFiles(files){
  const valid=files.filter(f=>{
    const ext='.'+f.name.split('.').pop().toLowerCase();
    return ALLOWED.has(ext);
  });
  if(!valid.length)return;
  valid.forEach(f=>fileQueue.push({file:f,status:'pending',jobId:null}));
  renderQueue();
  dz.classList.add('acquired');
  document.getElementById('run-btn').disabled=false;
}

function clearQueue(){
  if(queueRunning)return;
  fileQueue=[];
  renderQueue();
  document.getElementById('run-btn').disabled=true;
  dz.classList.remove('acquired');
}

function removeFromQueue(idx){
  if(fileQueue[idx]?.status==='running')return;
  fileQueue.splice(idx,1);
  renderQueue();
  if(!fileQueue.length){
    document.getElementById('run-btn').disabled=true;
    dz.classList.remove('acquired');
  }
}

function renderQueue(){
  const wrap=document.getElementById('queue-wrap');
  const list=document.getElementById('queue-list');
  if(!fileQueue.length){wrap.style.display='none';return;}
  wrap.style.display='block';
  list.innerHTML='';
  fileQueue.forEach((item,i)=>{
    const icons={pending:'○',running:'◎',done:'✓',error:'✕'};
    const badges={pending:'qb-pending',running:'qb-running',done:'qb-done',error:'qb-error'};
    const labels={pending:'PENDING',running:'RUNNING',done:'DONE',error:'ERROR'};
    const size=(item.file.size/1024/1024).toFixed(1)+' MB';
    const row=document.createElement('div');
    row.className=`q-row ${item.status}`;
    row.innerHTML=`
      <div class="q-num">${i+1}</div>
      <div class="q-icon">${icons[item.status]}</div>
      <div class="q-info">
        <div class="q-name">${item.file.name}</div>
        <div class="q-meta">${size}${item.jobId?' &nbsp;·&nbsp; ID: '+item.jobId:''}</div>
      </div>
      <div class="fc-badge ${badges[item.status]}">${labels[item.status]}</div>
      <button class="q-remove" onclick="removeFromQueue(${i})" ${item.status==='running'?'disabled':''} title="Remove">×</button>`;
    list.appendChild(row);
  });
}

// ── Log ────────────────────────────────────────────────────────────────
let logLines=[];
function appendLog(msg){
  logLines.push(msg);
  const box=document.getElementById('log-box');
  const cur=box.querySelector('.tcur');
  const init=box.querySelector('.lm');
  if(init&&init.textContent.includes('awaiting'))init.remove();
  if(cur)cur.remove();
  const d=document.createElement('div');d.className='ll';
  if(msg.startsWith('ERROR')||msg.includes('[ERROR]'))d.classList.add('le');
  else if(msg.includes('[WARN]')||msg.startsWith('WARN'))d.classList.add('lw');
  else if(msg==='DONE'||msg.toLowerCase().includes('pipeline complete'))d.classList.add('ld');
  else d.classList.add('li');
  d.textContent=msg;
  box.appendChild(d);
  const nc=document.createElement('span');nc.className='tcur';box.appendChild(nc);
  box.scrollTop=box.scrollHeight;
}
function copyLog(){
  navigator.clipboard.writeText(logLines.join('\n')).then(()=>{
    const b=document.getElementById('copy-btn');
    b.textContent='COPIED!';b.style.color='var(--green)';
    setTimeout(()=>{b.textContent='COPY LOG';b.style.color=''},1500);
  });
}

// ── Stage detection ────────────────────────────────────────────────────
function detectStage(msg){
  const dm=msg.match(/\[DONE\] Stage: (\w+)/);
  if(dm){const k=dm[1];if(stageMap[k])setStage(k,'done','Done');}
  const sm=msg.match(/\[START\] Stage: (\w+)/);
  if(sm){
    const k=sm[1];
    if(stageMap[k]){
      if(activeStage&&activeStage!==k)setStage(activeStage,'done','Done');
      setStage(k,'active','Running...');activeStage=k;
    }
  }
  // Catch stage transitions from raw log lines (no [START]/[DONE] markers)
  const stagePatterns = [
    ['input_validation',  [/Video validated/,/JAAD validated/]],
    ['frame_extraction',  [/Extracted \d+ frames/,/frame_extractor:/]],
    ['frame_cleaning',    [/Frame cleaning:/,/frame_cleaner:/,/Adaptive blur/]],
    ['detection',         [/Detection complete/,/YOLO model loaded/,/detector:/]],
    ['tracking',          [/Tracking complete/,/tracker:/]],
    ['behavior_analysis', [/Behavior distribution/,/behavior_analyzer:/]],
    ['intent_prediction', [/Intent prediction complete/,/intent_predictor:/,/Intent model/]],
    ['tagging',           [/Tagging complete/,/tagger:/]],
    ['export',            [/JSON written/,/CSV written/,/exporter:/]],
    ['render',            [/Rendering annotated/,/Rendering \d+ frames/,/visualizer:/]],
    ['xml',               [/Generating XML/,/XML annotation/]],
  ];
  for(const [k, patterns] of stagePatterns){
    if(patterns.some(p=>p.test(msg))){
      if(!completedStages.has(k)&&activeStage!==k){
        if(activeStage&&activeStage!==k){setStage(activeStage,'done','Done');completedStages.add(activeStage);}
        setStage(k,'active','Running...');activeStage=k;
      }
    }
  }
  if(msg.includes('Video saved')){setStage('render','done','Done');completedStages.add('render');updateProgress(completedStages.size/STAGES.length*100);}
  if(msg.includes('annotations.xml')||msg.includes('XML written')){setStage('xml','done','Done');completedStages.add('xml');updateProgress(completedStages.size/STAGES.length*100);}
}

// ── Queue runner ───────────────────────────────────────────────────────
async function startQueue(){
  if(queueRunning||!fileQueue.length)return;
  queueRunning=true;
  document.getElementById('run-btn').disabled=true;
  document.getElementById('pipeline-card').style.display='block';
  document.getElementById('garc').classList.add('on');

  const pending=fileQueue.filter(it=>it.status==='pending');
  for(let i=0;i<pending.length;i++){
    const item=pending[i];
    item.status='running';
    renderQueue();
    logLines=[];
    resetLog();
    completedStages=new Set();activeStage=null;
    buildFlowchart();updateProgress(0);
    document.body.classList.add('pl-running');
    document.body.classList.remove('pl-done');

    appendLog(`[INFO] Processing ${item.file.name} (${i+1}/${pending.length})`);

    const job_id=await runSingleJob(item.file);
    item.jobId=job_id;

    if(job_id){
      const ok=await waitForJob(job_id);
      item.status=ok?'done':'error';
      if(ok){
        document.body.classList.remove('pl-running');
        document.body.classList.add('pl-done');
        await appendResultCard(job_id,item.file.name);
      }
    }else{
      item.status='error';
    }
    renderQueue();
  }

  queueRunning=false;
  // Re-enable if there are still pending items
  const stillPending=fileQueue.some(it=>it.status==='pending');
  document.getElementById('run-btn').disabled=!stillPending;
}

function resetLog(){
  const box=document.getElementById('log-box');
  box.innerHTML='<span class="lm">$ starting next mission...</span><span class="tcur"></span>';
}

async function runSingleJob(file){
  const fd=new FormData();fd.append('file',file);
  try{
    const r=await fetch('/upload',{method:'POST',body:fd});
    if(!r.ok){appendLog('ERROR: Upload failed — '+await r.text());return null;}
    const {job_id}=await r.json();
    return job_id;
  }catch(e){appendLog('ERROR: '+e.message);return null;}
}

function waitForJob(jobId){
  return new Promise(resolve=>{
    const es=new EventSource(`/progress/${jobId}`);
    es.onmessage=e=>{
      const msg=e.data;
      if(msg==='[heartbeat]')return;
      appendLog(msg);
      detectStage(msg);
      if(msg==='DONE'){
        es.close();
        document.body.classList.remove('pl-running');
        resolve(true);
      }
    };
    es.onerror=()=>{
      es.close();
      appendLog('ERROR: Connection lost');
      document.body.classList.remove('pl-running');
      resolve(false);
    };
  });
}

  if(st.status==='error'){appendLog('Pipeline failed. See log above.');return;}

  let frameData=[];
  try{const jr=await fetch(`/download/${jobId}/json`);frameData=await jr.json();}catch(e){}

  const tf=frameData.length;
  const df=frameData.filter(r=>r.scene_tag==='DANGER').length;
  const sf=tf-df;
  const to=frameData.reduce((s,r)=>s+(r.objects?.length||0),0);

  const sec=document.getElementById('results-sec');
  sec.style.display='block';
  const list=document.getElementById('results-list');

  const cardId='res-'+jobId;
  const card=document.createElement('div');
  card.className='res-card';
  card.id=cardId;
  card.innerHTML=`

          <div class="res-mini-stat">Objects <span>${to.toLocaleString()}</span></div>
          <div class="res-mini-stat danger">DANGER <span>${df.toLocaleString()}</span></div>
          <div class="res-mini-stat safe">SAFE <span>${sf.toLocaleString()}</span></div>
        </div>
      </div>
      <div class="res-toggle">▼</div>
    </div>
    <div class="res-body">
      ${buildStatsHtml(tf,to,df,sf,jobId)}
      ${buildTimelineHtml(frameData,jobId)}
      <div class="vid-wrap" style="position:relative">
        <video id="vid-${jobId}" controls preload="auto" playsinline
               style="width:100%;display:block;background:#000;min-height:160px">
        </video>
        <div id="verr-${jobId}" style="display:none;position:absolute;inset:0;align-items:center;justify-content:center;background:rgba(5,10,20,.85);flex-direction:column;gap:10px;padding:20px;text-align:center">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--red)" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>

    </div>`;
  list.appendChild(card);

  // Auto-open latest
  card.classList.add('open');

  // Wire up video
  const vid=document.getElementById(`vid-${jobId}`);
  const verrBox=document.getElementById(`verr-${jobId}`);
  const verrMsg=document.getElementById(`verrmsg-${jobId}`);

  // Set src programmatically so we can attach error handler first

  vid.addEventListener('timeupdate',()=>{
    document.getElementById(`vfn-${jobId}`).textContent=`FRAME ${Math.floor(vid.currentTime*30)||'—'}`;
  });

  // Show actionable error overlay when codec/network fails
  vid.addEventListener('error',()=>{
    const codes={1:'ABORTED',2:'NETWORK ERROR',3:'DECODE ERROR (codec not supported)',4:'FORMAT NOT SUPPORTED'};
    const code=vid.error?vid.error.code:0;
    const msg=codes[code]||'Unknown error';
    verrMsg.textContent=`Video error: ${msg}. The annotated video was saved — click below to download it.`;
    verrBox.style.display='flex';
    vid.style.display='none';
  });

  vid.addEventListener('loadedmetadata',()=>{
    verrBox.style.display='none';
    vid.style.display='block';
  });

  // Wire up timeline frames
  card.querySelectorAll('.tl-f').forEach((f,i)=>{
    const step=Math.max(1,Math.floor(frameData.length/320));
    const sampled=frameData.filter((_,j)=>j%step===0);
    f.addEventListener('click',()=>{if(vid.duration)vid.currentTime=(i/sampled.length)*vid.duration;});
  });

  sec.scrollIntoView({behavior:'smooth'});
}

function toggleResult(cardId){
  document.getElementById(cardId).classList.toggle('open');
}

function buildTimelineHtml(frameData,jobId){
  if(!frameData.length)return'';
  const step=Math.max(1,Math.floor(frameData.length/320));
  const sampled=frameData.filter((_,i)=>i%step===0);
  const bars=sampled.map((r,i)=>`<div class="tl-f${r.scene_tag==='DANGER'?' d':''}" title="Frame ${r.frame_id||i} — ${r.scene_tag||'SAFE'}"></div>`).join('');
  return `<div class="tl-wrap" style="margin-bottom:18px">
    <div class="tl-label">FRAME TIMELINE — CLICK TO SEEK</div>
    <div class="tl-bar" id="tl-${jobId}">${bars}</div>
  </div>`;
}
